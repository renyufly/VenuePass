server:
  port: ${PORT:8080}
spring:
  application:
    name: venuepass
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/venuepass?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:venuepass}
    password: ${DB_PASSWORD:venuepass}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: venuepass-reservations
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  flyway:
    enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
venuepass:
  payment-minutes: ${PAYMENT_MINUTES:15}
  operator-password: ${OPERATOR_PASSWORD}
  checker-password: ${CHECKER_PASSWORD}
