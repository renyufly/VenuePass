services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: venuepass
      MYSQL_USER: venuepass
      MYSQL_PASSWORD: venuepass
      MYSQL_ROOT_PASSWORD: local-root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
  redis:
    image: redis:8.2.9-alpine
  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/venuepass?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: venuepass
      DB_PASSWORD: venuepass
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-change-me-operator}
      CHECKER_PASSWORD: ${CHECKER_PASSWORD:-change-me-checker}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://app:8080
    depends_on:
      app:
        condition: service_started
volumes:
  mysql-data:
